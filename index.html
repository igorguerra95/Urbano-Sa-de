              "Psychiatric",

          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Como funciona a primeira consulta na Urbano Saúde?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A primeira consulta foi pensada para oferecer tempo e tranquilidade. O profissional realiza uma escuta atenta do seu histórico, rotina, exames prévios e objetivos antes de propor qualquer conduta."
                }
              },
              {
                "@type": "Question",
                "name": "Qual é a diferença entre psiquiatria e psicologia na clínica?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Na Urbano Saúde, psiquiatras, psicólogos e terapeutas atuam de forma coordenada. A psicologia trabalha processos emocionais e comportamentais por meio da psicoterapia, enquanto a psiquiatria avalia aspectos clínicos e, quando indicado, o suporte medicamentoso."
                }
              },
              {
                "@type": "Question",
                "name": "Posso combinar especialidades médicas e acompanhamento emocional?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. Nosso modelo integra saúde mental com endocrinologia, cardiologia, clínica geral, nutrição e pediatria, permitindo que seu cuidado considere sono, metabolismo, saúde cardiovascular e bem-estar emocional em conjunto."
                }
              }
            ]
          }
        ]
      }
